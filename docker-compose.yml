services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gopress}
      MYSQL_USER: ${MYSQL_USER:-gopress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ghcr.io/bigzzh2022/gopress-api:${GOPRESS_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
      args:
        VERSION: ${GOPRESS_TAG:-dev}
        COMMIT: ${GOPRESS_COMMIT:-unknown}
        BUILD_TIME: ${GOPRESS_BUILD_TIME:-unknown}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: 8080
      MYSQL_DSN: ${MYSQL_USER:-gopress}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE:-gopress}?charset=utf8mb4&parseTime=True&loc=Local
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      # Never falls back to a known value: the API refuses to start without a
      # unique 32+ character secret.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-168h}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Only trust forwarding headers from the Docker bridge network, otherwise
      # every visitor would share the proxy address and one rate-limit bucket.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOAD_DIR: /app/uploads
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-64}
      ADMIN_NAME: ${ADMIN_NAME:-GoPress Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@gopress.dev}
      # No default: the seed command refuses to create an administrator with a
      # published password.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      SEED_DEMO: ${SEED_DEMO:-true}
      GITHUB_REPO: ${GITHUB_REPO:-Bigzzh2022/GoPress}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    # Published on loopback only so the reverse proxy stays the single entry
    # point; direct access would bypass its body limit and security headers.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    image: ghcr.io/bigzzh2022/gopress-web:${GOPRESS_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  redis_data:
  uploads_data:
